spring:
  application:
    name: watchmark-backend
  # Local development reads secrets from the repo-root .env file (git-ignored).
  # In production the same keys are supplied as real environment variables.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:watchmark}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME:watchmark}
    password: ${DB_PASSWORD}
  jpa:
    # Never let Hibernate change the schema; Flyway owns it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  session:
    # Idle timeout: a session unused for this long expires on the server.
    timeout: ${SESSION_TIMEOUT:14d}
    jdbc:
      # Tables are created by Flyway (V3__create_spring_session.sql).
      initialize-schema: never
  mvc:
    problemdetails:
      enabled: true
  web:
    error:
      include-stacktrace: never
      include-message: never

# OpenAPI document (/v3/api-docs) and Swagger UI (/swagger-ui.html): off unless
# API_DOCS_ENABLED=true, which is meant for local development only.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}


management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

watchmark:
  security:
    # Secure attribute on the WMSESSION and XSRF-TOKEN cookies. Must be true in
    # production (HTTPS); false only for local http://localhost development.
    cookie-secure: ${SESSION_COOKIE_SECURE:false}
    # Browser lifetime of the session cookie (the server idle timeout still applies).
    session-cookie-max-age: 30d
  rate-limit:
    # Per client IP, across all accounts.
    login-per-client:
      limit: 30
      window: 5m
    # Per client IP and email pair; keyed by both so a remote attacker cannot
    # lock a victim out of their account from elsewhere.
    login-per-account:
      limit: 5
      window: 5m
    register-per-client:
      limit: 5
      window: 1h
    # Password change and account deletion, per signed-in user.
    sensitive-per-user:
      limit: 10
      window: 15m
    # Show search, per signed-in user (results are cached, but each new query
    # costs a provider request).
    search-per-user:
      limit: 60
      window: 1m
  metadata:
    # tmdb | mock | auto (auto = tmdb when a token is set, otherwise mock).
    # Production must use tmdb so a missing token fails fast.
    provider: ${METADATA_PROVIDER:auto}
  tmdb:
    read-access-token: ${TMDB_READ_ACCESS_TOKEN:}
    base-url: https://api.themoviedb.org/3
    image-base-url: https://image.tmdb.org/t/p
    language: en-US
    connect-timeout: 3s
    read-timeout: 5s
    max-requests-per-second: 20
    # Sizes offered by TMDB's /configuration endpoint; verify there if changed.
    poster-size: w342
    backdrop-size: w1280
    profile-size: w185
    still-size: w300
  tracking:
    # How long a tracking operation (watch, unwatch, bulk) can be undone.
    undo-window: 24h
    # How long undone/unwatched watch rows are kept before being purged.
    soft-delete-retention: 30d
    # Master switch for the purge job; false keeps soft-deleted rows forever.
    purge-enabled: true
