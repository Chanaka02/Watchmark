spring:
  application:
    name: watchmark-backend
  # Local development reads secrets from the repo-root .env file (git-ignored).
  # In production the same keys are supplied as real environment variables.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:watchmark}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME:watchmark}
    password: ${DB_PASSWORD}
  jpa:
    # Never let Hibernate change the schema; Flyway owns it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  session:
    # Idle timeout: a session unused for this long expires on the server.
    timeout: ${SESSION_TIMEOUT:14d}
    jdbc:
      # Tables are created by Flyway (V3__create_spring_session.sql).
      initialize-schema: never
  mvc:
    problemdetails:
      enabled: true
  web:
    error:
      include-stacktrace: never
      include-message: never


management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

watchmark:
  security:
    # Secure attribute on the WMSESSION and XSRF-TOKEN cookies. Must be true in
    # production (HTTPS); false only for local http://localhost development.
    cookie-secure: ${SESSION_COOKIE_SECURE:false}
    # Browser lifetime of the session cookie (the server idle timeout still applies).
    session-cookie-max-age: 30d
  rate-limit:
    # Per client IP, across all accounts.
    login-per-client:
      limit: 30
      window: 5m
    # Per client IP and email pair; keyed by both so a remote attacker cannot
    # lock a victim out of their account from elsewhere.
    login-per-account:
      limit: 5
      window: 5m
    register-per-client:
      limit: 5
      window: 1h
    # Password change and account deletion, per signed-in user.
    sensitive-per-user:
      limit: 10
      window: 15m
  tracking:
    # How long a tracking operation (watch, unwatch, bulk) can be undone.
    undo-window: 24h
    # How long undone/unwatched watch rows are kept before being purged.
    soft-delete-retention: 30d
    # Master switch for the purge job; false keeps soft-deleted rows forever.
    purge-enabled: true
